<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#0b0d12;--card:#151922;--tx:#eef1f6;--sub:#9aa3b4;--line:#262c38;--ac:#7aa2ff;--ac2:#1c2742;--w:#22c55e;--l:#f87171;--d:#8b93a3;--u:#3b4252;--atk:#fbbf24;--def:#7aa2ff;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;letter-spacing:-.01em}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 40px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top{max-width:960px;margin:0 auto;padding:14px 16px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;margin-right:auto;display:flex;align-items:center;gap:8px}.emb{width:38px;height:38px;object-fit:contain}.brand b{font-weight:800}.brand span{color:var(--ac)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button,.seg select{border:0;background:none;color:var(--sub);font:inherit;font-size:14px;font-weight:600;padding:7px 12px;border-radius:9px;cursor:pointer}
.seg .on{background:var(--ac);color:#0b0d12}.seg select{appearance:none;-webkit-appearance:none;padding-right:22px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;background-size:4px 4px;background-repeat:no-repeat}
.seg select.on{color:#0b0d12}.seg select option{color:var(--tx);background:var(--card)}
.hero{padding:18px 2px 6px}.hero h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em}.hero p{margin:6px 0 0;color:var(--sub);font-size:14px}
.badge{display:inline-block;margin-left:6px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--ac2);color:var(--ac);vertical-align:middle}
.grid{display:grid;gap:12px}.kpi{grid-template-columns:repeat(2,1fr);margin-top:14px}
@media(min-width:760px){.kpi{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.kpi .card .l{font-size:12px;color:var(--sub);font-weight:600}.kpi .card .v{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-.03em;line-height:1.15;word-break:keep-all}.kpi .card .s{font-size:12px;color:var(--sub);margin-top:4px}
.v small{font-size:15px;font-weight:700;color:var(--sub);margin-left:2px}
.wl{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:10px;background:var(--line)}.wl i{display:block}
section{margin-top:12px}h2{font-size:16px;font-weight:700;margin:0 0 4px}.cap{font-size:12px;color:var(--sub);margin-bottom:12px}
.rk{display:grid;grid-template-columns:22px 64px 1fr auto;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.rk .n{color:var(--sub);font-size:12px;font-weight:700;text-align:center}.rk .n.t{color:var(--ac)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;display:flex}.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
.num{font-variant-numeric:tabular-nums;text-align:right;font-weight:600;white-space:nowrap}.num em{font-style:normal;color:var(--sub);font-weight:500;font-size:12px;margin-left:4px}
.more{width:100%;margin-top:8px;padding:10px;border:0;background:var(--ac2);color:var(--ac);border-radius:12px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.lg{display:flex;gap:10px;font-size:12px;color:var(--sub)}.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.games{list-style:none;margin:0;padding:0}.games li{display:grid;grid-template-columns:48px 1fr auto;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:center}
.games li:first-child{border-top:0}.dt{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}.op{font-weight:600;font-size:14px}.mv{font-size:12px;color:var(--sub);margin-top:3px}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;color:#0b0d12;white-space:nowrap}.승{background:var(--w)}.패{background:var(--l)}.무{background:var(--d)}.미확인,.형태{background:var(--u);color:var(--tx)}.자체{background:var(--ac2);color:var(--ac)}
.sc{font-size:13px;font-weight:700;margin-right:6px;font-variant-numeric:tabular-nums}
.t-a{color:var(--atk)}.t-d{color:var(--def)}
ul.ins{margin:0;padding:0;list-style:none}ul.ins li{padding:9px 0 9px 22px;position:relative;font-size:14px;line-height:1.55;border-top:1px solid var(--line)}ul.ins li:first-child{border-top:0}
ul.ins li:before{content:"";position:absolute;left:4px;top:16px;width:7px;height:7px;border-radius:50%;background:var(--ac)}
.yr{display:grid;grid-template-columns:40px 1fr 92px;gap:10px;align-items:center;padding:6px 0;font-size:13px}.yr.low{opacity:.45}
.yr .stk{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--line)}.yr .stk i{display:block}
.trend{width:100%;height:120px;margin:4px 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 4px;border-top:1px solid var(--line);text-align:left}th{color:var(--sub);font-weight:600;font-size:12px;border-top:0}
.k{color:var(--sub);font-size:12px}footer{text-align:center;color:var(--sub);font-size:12px;padding:24px 0 8px;line-height:1.6}
.hide{display:none}

$('yr').innerHTML=D.years.map(y=>{const t=y.ext||1;return `<div class="yr ${y.low?'low':''}"><span class="k">${y.y}</span><div class="stk"><i style="width:${y.w/t*100}%;background:var(--w)"></i><i style="width:${y.d/t*100}%;background:var(--d)"></i><i style="width:${y.l/t*100}%;background:var(--l)"></i><i style="width:${y.u/t*100}%;background:var(--u)"></i></div><span class="num">${y.pct==null?'-':y.pct+'%'}${y.y==D.best?' 🏆':''}<em>${y.w}-${y.d}-${y.l}</em></span></div>`}).join('');
const pts=D.years.filter(y=>!y.low&&y.pct!=null),W=300,H=110,ys=D.years.map(y=>y.y),x=y=>10+(ys.indexOf(y)/(ys.length-1||1))*(W-20),yv=p=>H-12-(p/100)*(H-28);
$('trend').setAttribute('viewBox',`0 0 ${W} ${H}`);
$('trend').innerHTML=`<line x1="10" x2="${W-10}" y1="${yv(50)}" y2="${yv(50)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${W-10}" y="${yv(50)-4}" font-size="9" fill="var(--sub)" text-anchor="end">50%</text><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>x(p.y)+','+yv(p.pct)).join(' ')}"/>`+pts.map(p=>`<circle cx="${x(p.y)}" cy="${yv(p.pct)}" r="3.5" fill="var(--card)" stroke="var(--ac)" stroke-width="2"/><text x="${x(p.y)}" y="${yv(p.pct)-8}" font-size="10" font-weight="700" fill="var(--tx)" text-anchor="middle">${p.pct}</text><text x="${x(p.y)}" y="${H-1}" font-size="9" fill="var(--sub)" text-anchor="middle">${p.y.slice(2)}</text>`).join('');
$('h2h').innerHTML=D.h2h.map(h=>`<tr><td><b>${h.opp}</b><div class="k">${h.yrs.join(' · ')}</div></td><td>${h.n}</td><td>${h.w}승 ${h.d}무 ${h.l}패${h.u?`<div class="k">미확인 ${h.u}</div>`:''}</td><td class="num">${h.gf}:${h.ga}</td></tr>`).join('')}
$('attk').textContent=`참석 명단 있는 ${D.named}경기 기준 · ${D.attendance.length}명`;
const att=a=>{const rk=rank(D.attendance,'n');$('att').innerHTML=D.attendance.length?D.attendance.slice(0,a?999:10).map((x,i)=>`<div class="rk"><span class="n ${rk[i]<=3?'t':''}">${rk[i]}</span><span>${x.name}</span><div class="bar"><i style="width:${x.pct}%"></i></div><span class="num">${x.pct}%<em>${x.n}회</em></span></div>`).join(''):'<div class="k">참석 명단 기록 없음</div>'};
const mvp=a=>{const rk=rank(D.mvp,'t');$('mvp').innerHTML=D.mvp.length?D.mvp.slice(0,a?999:10).map((m,i)=>`<div class="rk"><span class="n ${rk[i]<=3?'t':''}">${rk[i]}</span><span>${m.name}</span><div class="bar"><i style="width:${m.a/tm.t*100}%;background:var(--atk);border-radius:4px 0 0 4px"></i><i style="width:${m.d/tm.t*100}%;background:var(--def);border-radius:0"></i><i style="width:${m.o/tm.t*100}%;background:var(--d);border-radius:0"></i></div><span class="num">${m.t}회<em>${m.a}/${m.d}${m.o?'+'+m.o:''}</em></span></div>`).join(''):'<div class="k">MVP 기록 없음</div>'};
const multi=key=='all';
const gl=a=>{const G=D.games.slice().reverse();$('games').innerHTML=G.slice(0,a?9999:12).map(g=>{const m=(g.mvpA||[]).map(n=>`<span class="t-a">${n}</span>`).concat((g.mvpD||[]).map(n=>`<span class="t-d">${n}</span>`)).concat(g.mvpO||[]).join(' · ');
const r=g.type=='미확인'?'<span class="pill 형태">형태 미확인</span>':g.type=='자체'?'<span class="pill 자체">자체전</span>':`${g.score?`<span class="sc">${g.score}${g.est?'*':''}</span>`:''}<span class="pill ${g.res}">${g.res}</span>`;
return `<li><span class="dt">${multi?g.date.slice(2,4)+'.':''}${g.date.slice(5).replace('-','.')}</span><div><div class="op">${g.opp}</div><div class="mv">${g.n?g.n+'명':''}${g.n&&m?' · ':''}${m}</div></div><div>${r}</div></li>`}).join('');$('gm').classList.toggle('hide',G.length<=12)};
att(0);mvp(0);gl(0);tog('attm',att);tog('mvpm',mvp);tog('gm',gl);
$('attm').classList.toggle('hide',D.attendance.length<=10);$('mvpm').classList.toggle('hide',D.mvp.length<=10);
$('gk').textContent=`${D.games.length}경기 · 최신순 · *추정 스코어`;
$('ins').innerHTML=D.insights.map(s=>`<li>${s}</li>`).join('');
$('foot').innerHTML=`밴드 투표·댓글 기준 · 결과 미확인 경기 다수<br>갱신 ${ALL.updated}`}
const h=location.hash.slice(1);show(ALL.seasons[h]?h:cur);
</script></body></html>
